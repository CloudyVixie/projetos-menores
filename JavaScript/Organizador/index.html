<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Organizador</title>
</head>
<body>
    <main>
        <label for="input">
            <textarea  id="txtAreaInput" placeholder="Insira seu texto aqui. separe-o por quebra de linha ou virgula :D"></textarea>
            <button id="btnOrganizar">Organizar</button>
        </label>


        <label for="output">
            <textarea  id="txtAreaOutput" readonly placeholder="Seu texto sai organizado aqui"></textarea>
            <button id="btnCopiar"> Copiar </button>
        </label>


    </main>



    <script src="script.js"></script>
</body>
</html>
