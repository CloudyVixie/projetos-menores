<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | SensiFinder</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <main>
        <h1>Criar conta</h1>

        <form id="formCadastro">
            <label for="cadastroNome">Nome de usuário</label>
            <input type="text" id="cadastroNome" required>

            <label for="cadastroSenha">Senha</label>
            <input type="password" id="cadastroSenha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagemCadastro"></p>

        <p>Já tem uma conta?</p>
        <a href="index.html">Fazer login</a>
    </main>

    <script src="../script.js"></script>
</body>
</html>
