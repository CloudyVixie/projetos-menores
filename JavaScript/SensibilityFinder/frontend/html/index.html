<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensibility Finder</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <main>
        <header class="topo">
            <div>
                <h1>SensiFinder</h1>
                <p>Olá, <span id="nomeUsuario"></span>!</p>
            </div>
            <button type="button" id="sair" class="botao-secundario">Sair</button>
        </header>

        <section class="painel">
            <h2>Calculadora de sensibilidade</h2>
            <p>Informe sua sensibilidade e selecione o valor que deseja guardar.</p>

            <form id="formSensibilidade">
                <label for="sensibilidade">Sensibilidade atual</label>
                <input
                    type="number"
                    id="sensibilidade"
                    min="0.01"
                    step="any"
                    inputmode="decimal"
                    placeholder="Ex.: 5.5"
                    required
                >
                <button type="submit">Calcular</button>
            </form>

            <div id="resultado" aria-live="polite"></div>
        </section>

        <section class="painel">
            <h2>Histórico</h2>
            <ul id="listaHistorico"></ul>
        </section>
    </main>

    <script src="../script.js"></script>
</body>
</html>
