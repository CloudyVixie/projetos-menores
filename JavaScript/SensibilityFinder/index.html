<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensibility Finder</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <section>
        <p>Calcule a sensibilidade perfeita para seu jogo</p>
        <input id="sensi_base" type="number" min="0" placeholder="Sensibilidade base">
        <button id="calcular">Calcular</button>


        <label id="sensi_baixa"> </label>
        <button id="usar_sensi_baixa">Usar sensibilidade baixa</button>

        <hr class="divisor">
        <label id="sensi_atual"> </label>
        <hr class="divisor">


        <label id="sensi_alta"> </label>
        <button id="usar_sensi_alta">Usar sensibilidade alta</button>
    </section>


    <script src="script.js"></script>
</body>
</html>
